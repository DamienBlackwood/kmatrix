[project]
name = "kmatrix"
version = "0.3.0"
description = "A Python-based cmatrix clone with smooth delta rendering and themes."
requires-python = ">=3.13"
dependencies = []

[project.scripts]
kmatrix = "kmatrix:main_wrapper"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["kmatrix"]
